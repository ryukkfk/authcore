services:
  postgres:
    image: postgres:17-alpine
    container_name: authcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authcore
      POSTGRES_PASSWORD: authcore_dev
      POSTGRES_DB: authcore
    ports:
      - "5432:5432"
    volumes:
      - authcore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authcore -d authcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: authcore-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - authcore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  authcore_postgres_data:
  authcore_redis_data: