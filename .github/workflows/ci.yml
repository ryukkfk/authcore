name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authcore_test
          POSTGRES_PASSWORD: authcore_test
          POSTGRES_DB: authcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authcore_test -d authcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://authcore_test:authcore_test@localhost:5432/authcore_test
      TEST_REDIS_URL: redis://127.0.0.1:6380

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Workspace packages expose dist entrypoints needed by downstream checks.
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm --filter @authcore/db test:integration

      - name: Redis integration tests
        run: pnpm --filter @authcore/api test:redis

      - name: Signup HTTP Redis PostgreSQL E2E tests
        run: pnpm --filter @authcore/api test:e2e
