name: CI

on:
  push:
    branches:
      - main
      - fix/pg-pool-a1-owned-disposal
      - feat/signup-s1-transaction-owner
      - feat/signup-s1-outcome-owner
      - feat/signup-s2-secure-reservation
      - feat/signup-s3-postgres-capacity
      - feat/signup-s4-recovery-orchestration
  pull_request:
    branches:
      - main
      - test/signup-s0-commit-outcomes
      - fix/pg-pool-a1-owned-disposal
      - feat/signup-s1-transaction-owner
      - feat/signup-s2-secure-reservation
      - feat/signup-s3-postgres-capacity

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authcore_test
          POSTGRES_PASSWORD: authcore_test
          POSTGRES_DB: authcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authcore_test -d authcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://authcore_test:authcore_test@localhost:5432/authcore_test
      TEST_REDIS_URL: redis://127.0.0.1:6380

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: A1 driver patch integrity
        run: node scripts/verify-driver-patches.mjs

      - name: Production dependency advisory scan
        timeout-minutes: 2
        run: pnpm audit --prod --registry=https://registry.npmjs.org

      - name: Lint
        run: pnpm lint

      # Workspace packages expose dist entrypoints needed by downstream checks.
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: A1 real PostgreSQL driver disposal
        env:
          A1_POSTGRES_APPROVED: 'true'
          SIGNUP_ENABLED: 'false'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -n "$TEST_DATABASE_URL"
          test -z "${DATABASE_URL:-}"
          pnpm --filter @authcore/db test:integration src/driver-disposal.integration.test.ts --reporter=verbose --reporter=json --outputFile.json=a1-results.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const result = JSON.parse(readFileSync("packages/db/a1-results.json", "utf8"));
            const tests = result.testResults.flatMap(file => file.assertionResults);
            assert.equal(result.success, true);
            assert.equal(tests.length, 3);
            assert(tests.every(test => test.status === "passed"));
            console.log("A1_REAL_POSTGRES total=3 passed=3 skipped=0");
          '

      - name: S1 public pool ownership regression
        env:
          S1_POSTGRES_APPROVED: 'true'
          SIGNUP_ENABLED: 'false'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -n "$TEST_DATABASE_URL"
          test -z "${DATABASE_URL:-}"
          pnpm --filter @authcore/db test:integration src/signup-pool-ownership.integration.test.ts --reporter=verbose --reporter=json --outputFile.json=s1-pool-results.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const result = JSON.parse(readFileSync("packages/db/s1-pool-results.json", "utf8"));
            const tests = result.testResults.flatMap(file => file.assertionResults);
            assert.equal(result.success, true);
            assert.equal(tests.length, 1);
            assert(tests.every(test => test.status === "passed"));
            console.log("S1_POOL_OWNERSHIP total=1 passed=1 skipped=0");
          '

      - name: Test
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm --filter @authcore/db test:integration

      - name: S1 real PostgreSQL outcome and inherited S0 verification
        env:
          S0_POSTGRES_APPROVED: 'true'
          SIGNUP_ENABLED: 'false'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -n "$TEST_DATABASE_URL"
          test -z "${DATABASE_URL:-}"
          pnpm --filter @authcore/db test:integration src/signup-commit-outcomes.integration.test.ts --reporter=verbose --reporter=json --outputFile.json=s0-results.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const result = JSON.parse(readFileSync("packages/db/s0-results.json", "utf8"));
            const tests = result.testResults.flatMap(file => file.assertionResults);
            assert.equal(result.success, true);
            assert.equal(tests.length, 14);
            assert(tests.every(test => test.status === "passed"));
            console.log("S1_REAL_OUTCOMES total=14 passed=14 skipped=0");
          '

      - name: S2 real PostgreSQL secure reservation and terminal expiry
        env:
          S2_POSTGRES_APPROVED: 'true'
          SIGNUP_ENABLED: 'false'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -n "$TEST_DATABASE_URL"
          test -z "${DATABASE_URL:-}"
          pnpm --filter @authcore/api test src/identity/signup-reservation.integration.test.ts --reporter=verbose --reporter=json --outputFile.json=s2-results.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const result = JSON.parse(readFileSync("apps/api/s2-results.json", "utf8"));
            const tests = result.testResults.flatMap(file => file.assertionResults);
            assert.equal(result.success, true);
            assert.equal(tests.length, 19);
            assert(tests.every(test => test.status === "passed"));
            console.log("S2_REAL_RESERVATION total=19 passed=19 skipped=0");
          '

      - name: S3 real PostgreSQL capacity and independent HTTP processes
        env:
          S3_POSTGRES_APPROVED: 'true'
          SIGNUP_ENABLED: 'false'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -n "$TEST_DATABASE_URL"
          test -n "$TEST_REDIS_URL"
          test -z "${DATABASE_URL:-}"
          pnpm --filter @authcore/api test src/identity/signup-capacity.integration.test.ts --reporter=verbose --reporter=json --outputFile.json=s3-results.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const result = JSON.parse(readFileSync("apps/api/s3-results.json", "utf8"));
            const tests = result.testResults.flatMap(file => file.assertionResults);
            assert.equal(result.success, true);
            assert.equal(tests.length, 14);
            assert(tests.every(test => test.status === "passed"));
            console.log("S3_REAL_CAPACITY total=14 passed=14 skipped=0");
          '

      - name: S4 real protocol atomicity recovery and process crashes
        env:
          S4_POSTGRES_APPROVED: 'true'
          SIGNUP_ENABLED: 'false'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -n "$TEST_DATABASE_URL"
          test -n "$TEST_REDIS_URL"
          test -z "${DATABASE_URL:-}"
          pnpm --filter @authcore/api test src/identity/signup-protocol.integration.test.ts --reporter=verbose --reporter=json --outputFile.json=s4-results.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const result = JSON.parse(readFileSync("apps/api/s4-results.json", "utf8"));
            const tests = result.testResults.flatMap(file => file.assertionResults);
            assert.equal(result.success, true);
            assert.equal(tests.length, 26);
            assert(tests.every(test => test.status === "passed"));
            console.log("S4_REAL_PROTOCOL total=26 passed=26 skipped=0");
          '

      - name: Redis integration tests
        run: pnpm --filter @authcore/api test:redis

      - name: Signup HTTP Redis PostgreSQL E2E tests
        run: pnpm --filter @authcore/api test:e2e
