# Private local demo only. Never use these credentials or ports for deployment.
name: authcore-full-product-demo
services:
  postgres:
    image: postgres:17-alpine
    labels:
      com.authcore.local-demo: 'true'
    environment:
      POSTGRES_USER: authcore_demo_owner
      POSTGRES_PASSWORD: ${AUTHCORE_DEMO_OWNER_PASSWORD:?Run pnpm dev:setup}
      POSTGRES_DB: authcore_demo
    command:
      [
        postgres,
        -c,
        log_error_verbosity=terse,
        -c,
        log_min_error_statement=panic,
        -c,
        log_parameter_max_length_on_error=0,
        -c,
        log_statement=none,
      ]
    ports:
      - '127.0.0.1:${AUTHCORE_DEMO_PG_PORT:?Run pnpm dev:setup}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U authcore_demo_owner -d authcore_demo]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    labels:
      com.authcore.local-demo: 'true'
    command: [redis-server, --appendonly, 'yes']
    ports:
      - '127.0.0.1:${AUTHCORE_DEMO_REDIS_PORT:?Run pnpm dev:setup}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.6
    labels:
      com.authcore.local-demo: 'true'
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_LABEL: AUTHCORE LOCAL DEMO ONLY
    ports:
      - '127.0.0.1:${AUTHCORE_DEMO_MAIL_PORT:?Run pnpm dev:setup}:8025'
    volumes:
      - mail-data:/data
volumes:
  postgres-data:
  redis-data:
  mail-data:
