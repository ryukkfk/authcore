# Disposable local regression services. Separate from all historical Compose projects.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authcore_test
      POSTGRES_PASSWORD: authcore_test
      POSTGRES_DB: authcore_test
    command:
      [
        postgres,
        -c,
        log_error_verbosity=terse,
        -c,
        log_min_error_statement=panic,
        -c,
        log_parameter_max_length_on_error=0,
        -c,
        log_statement=none,
      ]
    ports:
      - '127.0.0.1:55433:5432'
      - '127.0.0.1:56380:6380'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U authcore_test -d authcore_test]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    network_mode: service:postgres
    command: [redis-server, --port, '6380']
    healthcheck:
      test: [CMD, redis-cli, -p, '6380', ping]
      interval: 2s
      timeout: 3s
      retries: 30
  runner:
    profiles: [test]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.test
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
